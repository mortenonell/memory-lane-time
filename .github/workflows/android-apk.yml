name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Verify Node
        run: |
          node -v
          npm -v

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build web bundle
        run: npm run build
        
      - name: Add Android platform
        run: |
          npx cap add android
           npx cap sync android
      
      - name: Set Android SDK versions
        run: |
          cat >> android/variables.gradle <<'EOF'
      
          ext {
              minSdkVersion = 33
              compileSdkVersion = 35
              targetSdkVersion = 35
          }
          EOF

      - name: Add runtime permissions to manifest
        run: |
          python3 - <<'EOF'
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p).read()

          perms = [
              "android.permission.POST_NOTIFICATIONS",
              "android.permission.READ_MEDIA_IMAGES",
              "android.permission.SCHEDULE_EXACT_ALARM",
              "android.permission.RECEIVE_BOOT_COMPLETED",
              "android.permission.INTERNET",
          ]

          block = "\n".join(
              f'    <uses-permission android:name="{x}" />'
              for x in perms if x not in s
          )

          if block:
              s = s.replace("</manifest>", block + "\n</manifest>")

          open(p, "w").write(s)
          EOF

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Assemble debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: countdown-widgets-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Countdown Widgets APK ${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
